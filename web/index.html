<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>heron-app2</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; max-width: 800px; }
      input, button { padding: 0.5rem; margin: 0.25rem 0; width: 100%; box-sizing: border-box; }
      button { width: auto; cursor: pointer; }
      pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>heron-app2 demo</h1>
    <p>Enter your deployed Adobe Runtime web action URL, then call it from this static page.</p>

    <label for="actionUrl">Runtime action URL</label>
    <input id="actionUrl" type="url" placeholder="https://adobeioruntime.net/api/v1/web/..." />

    <label for="name">Name (optional)</label>
    <input id="name" type="text" placeholder="World" />

    <button id="callAction" type="button">Call runtime action</button>
    <pre id="result">Result will appear here</pre>

    <script>
      const actionUrlInput = document.getElementById("actionUrl");
      const nameInput = document.getElementById("name");
      const result = document.getElementById("result");
      const callActionButton = document.getElementById("callAction");

      callActionButton.addEventListener("click", async () => {
        const actionUrl = actionUrlInput.value.trim();
        const name = nameInput.value.trim();

        if (!actionUrl) {
          result.textContent = "Please provide a runtime action URL.";
          return;
        }

        const url = new URL(actionUrl);
        if (name) {
          url.searchParams.set("name", name);
        }

        try {
          const response = await fetch(url);
          const payload = await response.json();
          result.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          result.textContent = `Request failed: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
